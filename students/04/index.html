<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsQuiz05 - export と import で名作文学リスト</title>
  <style>
    body {
      width: 600px;
      margin: 20px auto;
      padding: 0 16px;
      font-family: sans-serif;
    }

    h1 {
      font-size: 1.4rem;
    }

    .book-list {
      list-style: square;
      padding-left: 1.5em;
      line-height: 1.8;
    }

    .book-list li {
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <h1>名作文学リスト</h1>

  <ul class="book-list">
    <!-- ここに <li> が JavaScript から差し込まれます -->
  </ul>

  <!-- 重要：type="module" を付けないと import 文は使えません -->
  <script type="module">
    // 下の行に import 文を書いてください
    import { books } from './data.js';

    // ===== ここから下は完成済みです。書き換えないでください =====
    const ul = document.querySelector('.book-list');
    books.forEach(function (book) {
      const li = document.createElement('li');
      li.textContent = book.title + '(' + book.author + ')';
      ul.appendChild(li);
    });
  </script>
</body>

</html>
